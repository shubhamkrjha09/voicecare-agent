<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceCare — Front Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=6">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="mark">✚</span> VoiceCare <em>front desk</em></div>
    <div class="clock" id="clock"></div>
  </header>

  <main class="layout">
    <!-- Phone -->
    <section class="phone-col">
      <div class="phone" id="phone" data-state="idle">
        <div class="notch"></div>

        <div class="screen idle-screen">
          <div class="avatar">M</div>
          <div class="who">Maya</div>
          <div class="sub">Clinic receptionist · AI</div>
          <div class="langs"><span>English</span><span>हिंदी</span><span>বাংলা</span><span>Hinglish</span></div>
          <button class="btn call" id="callBtn" aria-label="Try call">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
          </button>
          <div class="hint">Try call</div>
        </div>

        <div class="screen live-screen">
          <div class="call-head">
            <div class="avatar sm">M</div>
            <div>
              <div class="who sm">Maya</div>
              <div class="status" id="callStatus">Connecting…</div>
            </div>
            <div class="timer" id="timer">00:00</div>
          </div>

          <canvas class="wave" id="wave" width="560" height="120"></canvas>

          <div class="transcript" id="transcript"></div>

          <div class="booking-card" id="bookingCard" hidden></div>

          <div class="controls">
            <button class="btn ghost" id="muteBtn" aria-label="Mute">
              <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11z"/></svg>
            </button>
            <button class="btn end" id="endBtn" aria-label="End call">
              <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11.3 11.3 0 0 0-2.66 1.85 1 1 0 0 1-1.41 0L.3 13.08a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7c4.5 0 8.6 1.75 11.7 4.67a1 1 0 0 1 0 1.41l-2.48 2.49a1 1 0 0 1-1.41 0 11.3 11.3 0 0 0-2.66-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9z"/></svg>
            </button>
          </div>
        </div>

        <div class="screen ended-screen">
          <div class="who">Call ended</div>
          <div class="sub" id="endedSummary"></div>
          <button class="btn call" id="againBtn" aria-label="Call again">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
          </button>
          <div class="hint">Call again</div>
        </div>
      </div>
      <audio id="botAudio" autoplay></audio>
    </section>

    <!-- Board -->
    <section class="board">
      <div class="panel">
        <div class="panel-head">
          <h2>Schedule</h2>
          <span class="meta" id="slotCount"></span>
        </div>
        <div class="doctors" id="doctors"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Appointments</h2>
          <span class="meta" id="apptCount"></span>
        </div>
        <table class="ledger">
          <thead><tr><th>#</th><th>Patient</th><th>Doctor</th><th>When</th><th>Status</th></tr></thead>
          <tbody id="appointments"></tbody>
        </table>
        <div class="empty" id="apptEmpty">No appointments yet.</div>
      </div>
    </section>
  </main>

  <script type="module" src="/assets/app.js?v=6"></script>
</body>
</html>
